<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f3f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Training · Studienkalender</title>
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <main class="app page">
    <header class="page-head">
      <h1>Training</h1>
      <p class="sub">Alle zwei Tage Gym, dazwischen ein Ruhetag</p>
    </header>

    <div class="train-layout">
      <div>
        <section aria-labelledby="h-today">
          <div class="section-head"><h2 id="h-today">Heute</h2></div>
          <div class="today-card" id="today"></div>
        </section>

        <section aria-labelledby="h-days">
          <div class="section-head"><h2 id="h-days">Nächste 14 Tage</h2></div>
          <div class="strip" id="strip"></div>
          <p class="strip-note">Markierte Tage sind Trainingstage. A und B wechseln sich ab. Nicht abgehakte Übungen kommen beim nächsten Training dazu.</p>
        </section>
      </div>

      <section aria-labelledby="h-plan">
        <div class="section-head"><h2 id="h-plan">Dein Plan</h2></div>
        <div class="plan-grid" id="plan"></div>
      </section>
    </div>

    <div class="reset-wrap">
      <button class="quiet-btn" id="shiftBtn"><span id="shiftIcon"></span>Rhythmus um einen Tag verschieben</button>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation"></nav>

  <script src="app.js?v=6"></script>
  <script>
    /* ===========================================================
       Trainingsplan: alle zwei Tage Gym, Einheiten A und B im Wechsel.
       Übungen hier anpassen: name = Übung, muscle = Muskelgruppe, sets = Sätze x Wiederholungen.
       =========================================================== */
    const WORKOUTS = [
      { key: "A", name: "Einheit A", exercises: [
        { name: "Bankdrücken", muscle: "Brust", sets: "3 × 8-10" },
        { name: "Latzug", muscle: "Rücken", sets: "3 × 10-12" },
        { name: "Schulterdrücken", muscle: "Schultern", sets: "3 × 10-12" },
        { name: "Rudern am Kabel", muscle: "Rücken", sets: "3 × 10-12" },
        { name: "Bizeps-Curls", muscle: "Bizeps", sets: "3 × 10-12" },
        { name: "Trizepsdrücken", muscle: "Trizeps", sets: "3 × 10-12" },
        { name: "Beinpresse", muscle: "Beine", sets: "3 × 10-12" },
      ] },
      { key: "B", name: "Einheit B", exercises: [
        { name: "Schrägbankdrücken", muscle: "Brust", sets: "3 × 8-10" },
        { name: "Latzug eng", muscle: "Rücken", sets: "3 × 10-12" },
        { name: "Seitheben", muscle: "Schultern", sets: "3 × 12-15" },
        { name: "Rudern an der Maschine", muscle: "Rücken", sets: "3 × 10-12" },
        { name: "Hammer-Curls", muscle: "Bizeps", sets: "3 × 10-12" },
        { name: "Trizeps über Kopf", muscle: "Trizeps", sets: "3 × 10-12" },
        { name: "Kniebeuge", muscle: "Beine", sets: "3 × 8-10" },
      ] },
    ];

    const BASE = "2026-10-07";            // erster Trainingstag (Einheit A)
    const SHIFT_KEY = "training_shift";   // "1" = Rhythmus um einen Tag verschoben
    const DONE_KEY = "training_done";     // alt: Liste komplett erledigter Tage
    const CHECK_KEY = "training_checks";  // { "YYYY-MM-DD": [Index abgehakter Übungen] }
    const DAYS_SHORT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

    function store(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
    }
    let shift = store(SHIFT_KEY, 0) ? 1 : 0;
    let checks = store(CHECK_KEY, {});
    /* Einträge älter als 60 Tage entfernen, damit der Speicher klein bleibt */
    for (const k of Object.keys(checks)) if (daysUntil(k) < -60) delete checks[k];
    /* Übernahme aus der alten Ganz-oder-gar-nicht-Markierung */
    for (const k of store(DONE_KEY, [])) {
      if (!checks[k] && daysUntil(k) >= -60) checks[k] = "all";
    }
    localStorage.removeItem(DONE_KEY);
    /* Einheitliches Format: pro Tag die Namen der abgehakten Übungen */
    for (const [k, v] of Object.entries(checks)) {
      const w = workoutOn(k);
      if (v === "all") checks[k] = w ? w.exercises.map((x) => x.name) : [];
      else if (Array.isArray(v)) {
        checks[k] = v.map((i) => (typeof i === "number" ? (w && w.exercises[i] ? w.exercises[i].name : null) : i))
          .filter(Boolean);
      } else delete checks[k];
    }
    const saveChecks = () => localStorage.setItem(CHECK_KEY, JSON.stringify(checks));
    saveChecks();

    /* Welche Einheit an einem Tag ansteht, oder null für Ruhetag */
    function workoutOn(key) {
      const n = Math.round((parseKey(key) - parseKey(BASE)) / 86400000) - shift;
      if (((n % 2) + 2) % 2 !== 0) return null;
      const idx = (((n / 2) % WORKOUTS.length) + WORKOUTS.length) % WORKOUTS.length;
      return WORKOUTS[idx];
    }
    function keyPlus(days) {
      const d = new Date();
      return toKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() + days));
    }
    function keyOffset(key, days) {
      const d = parseKey(key);
      return toKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() + days));
    }

    /* Nachholen: Übungen, die am vorherigen Trainingstag (zwei Tage davor) offen blieben.
       Gilt erst, wenn dieser Tag vorbei ist (ab 0:00 Uhr des Folgetags).
       Übungen, die an diesem Tag ohnehin im Plan stehen, kommen nicht doppelt. */
    function carriedInto(key) {
      const from = keyOffset(key, -2);
      const prev = workoutOn(from);
      const cur = workoutOn(key);
      if (!prev || !cur || from < BASE || from >= todayKey()) return { from, items: [] };
      const doneNames = new Set(checks[from] || []);
      const own = new Set(cur.exercises.map((x) => x.name));
      return { from, items: prev.exercises.filter((x) => !doneNames.has(x.name) && !own.has(x.name)) };
    }

    const exHTML = (w) => w.exercises.map((x) =>
      `<div class="ex"><span class="n">${escapeHtml(x.name)}<span class="mu">${escapeHtml(x.muscle || "")}</span></span><span class="s">${escapeHtml(x.sets)}</span></div>`).join("");

    /* ---- Heute: jede Übung einzeln abhaken, offene vom letzten Mal nachholen ---- */
    function renderToday() {
      const tKey = todayKey();
      const w = workoutOn(tKey);
      const el = document.getElementById("today");
      if (!w) {
        const nextKey = keyPlus(1);
        const next = workoutOn(nextKey);
        const n = carriedInto(nextKey).items.length;
        el.innerHTML = `
          <div class="today-kind">Ruhetag</div>
          <div class="today-sub">Nächstes Training morgen: ${next.name}${
            n ? `, dazu ${n} ${n === 1 ? "Übung" : "Übungen"} zum Nachholen` : ""}</div>`;
        return;
      }
      const carried = carriedInto(tKey);
      const all = [...w.exercises, ...carried.items];
      const names = new Set(all.map((x) => x.name));
      const set = new Set((checks[tKey] || []).filter((n) => names.has(n)));
      const allDone = set.size === all.length;

      const row = (x) => `
        <button class="ex check" role="checkbox" aria-checked="${set.has(x.name)}" data-name="${escapeAttr(x.name)}">
          <span class="box" aria-hidden="true">${ICON.check}</span>
          <span class="n">${escapeHtml(x.name)}<span class="mu">${escapeHtml(x.muscle || "")}</span></span>
          <span class="s">${escapeHtml(x.sets)}</span>
        </button>`;
      const fromDt = parseKey(carried.from);

      el.innerHTML = `
        <div class="today-kind is-gym">Trainingstag</div>
        <div class="today-sub">${w.name} · <span id="progress">${set.size} von ${all.length} erledigt</span></div>
        <div class="ex-list">
          ${w.exercises.map(row).join("")}
          ${carried.items.length ? `
            <div class="ex-sub">Nachholen vom ${DAYS_LONG[fromDt.getDay()]}, ${fromDt.getDate()}. ${MONTHS[fromDt.getMonth()]}</div>
            ${carried.items.map(row).join("")}` : ""}
        </div>
        <button class="btn btn-cancel pressable" id="allBtn">${allDone ? "Alle zurücksetzen" : "Alle abhaken"}</button>`;

      el.querySelectorAll(".check").forEach((b) => b.addEventListener("click", () => {
        const name = b.dataset.name;
        if (set.has(name)) set.delete(name); else set.add(name);
        checks[tKey] = [...set];
        saveChecks();
        renderToday();
        if (set.size === all.length) toast("Training erledigt");
      }));
      el.querySelector("#allBtn").addEventListener("click", () => {
        checks[tKey] = allDone ? [] : all.map((x) => x.name);
        saveChecks();
        renderToday();
        if (!allDone) toast("Training erledigt");
      });
    }

    /* ---- Nächste 14 Tage ---- */
    function renderStrip() {
      let html = "";
      for (let i = 0; i < 14; i++) {
        const key = keyPlus(i);
        const dt = parseKey(key);
        const w = workoutOn(key);
        const label = `${formatLongDate(key)}: ${w ? w.name : "Ruhetag"}`;
        html += `
          <div class="day ${w ? "gym" : ""} ${i === 0 ? "today" : ""}" aria-label="${label}">
            <span class="wd" aria-hidden="true">${DAYS_SHORT[dt.getDay()]}</span>
            <span class="mark" aria-hidden="true">${dt.getDate()}</span>
            <span class="tag" aria-hidden="true">${w ? w.key : ""}</span>
          </div>`;
      }
      document.getElementById("strip").innerHTML = html;
    }

    /* ---- Plan ---- */
    document.getElementById("plan").innerHTML = WORKOUTS.map((w) => `
      <div>
        <h3 class="plan-name">${w.name}</h3>
        <div class="group">${exHTML(w)}</div>
      </div>`).join("");

    /* ---- Rhythmus verschieben (nochmal tippen stellt zurück) ---- */
    document.getElementById("shiftIcon").innerHTML = ICON.shift;
    document.getElementById("shiftBtn").addEventListener("click", () => {
      shift = shift ? 0 : 1;
      localStorage.setItem(SHIFT_KEY, JSON.stringify(shift));
      renderToday();
      renderStrip();
      toast(workoutOn(todayKey()) ? "Heute ist jetzt Trainingstag" : "Heute ist jetzt Ruhetag");
    });

    mountTabbar("gym");
    renderToday();
    renderStrip();
    /* Nach Mitternacht oder beim Zurückkehren in die App neu berechnen */
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) { renderToday(); renderStrip(); }
    });
  </script>
</body>
</html>
